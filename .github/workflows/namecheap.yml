# Compila il sito e lo pubblica su Namecheap (cPanel → Setup Node.js App).
#
#   ramo "main"       → sito definitivo   (segreti FTP_SERVER / FTP_USERNAME / FTP_PASSWORD)
#   altri rami        → sito demo         (segreti FTP_DEMO_SERVER / FTP_DEMO_USERNAME / FTP_DEMO_PASSWORD)
#
# Senza segreti FTP non viene pubblicato nulla: il pacchetto resta scaricabile da
# GitHub → Actions → ultima esecuzione → Artifacts.
# Guida completa: README.md → "Messa online su Namecheap".
name: Build e pubblicazione (Namecheap)

on:
  push:
    branches:
      - main
      - claude/lilycare-website-redesign-3510to
  workflow_dispatch:

concurrency:
  # Una pubblicazione alla volta per ogni destinazione (sito definitivo / demo)
  group: namecheap-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Indirizzo pubblico del sito, inserito durante la build. Sul server può essere
      # sostituito dalla variabile SERVER_URL di cPanel (es. per la demo).
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'https://lilycare.ch' }}
      # "true" solo se sul server il modulo immagini "sharp" non funzionasse
      IMAGES_UNOPTIMIZED: ${{ vars.IMAGES_UNOPTIMIZED || 'false' }}
      NEXT_TELEMETRY_DISABLED: '1'
      # Si pubblica solo se i tre segreti della destinazione sono tutti impostati
      DEPLOY: ${{ (github.ref_name == 'main' && secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '') || (github.ref_name != 'main' && secrets.FTP_DEMO_SERVER != '' && secrets.FTP_DEMO_USERNAME != '' && secrets.FTP_DEMO_PASSWORD != '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:namecheap

      - name: Salva il pacchetto (scaricabile da Actions)
        uses: actions/upload-artifact@v4
        with:
          name: lilycare-namecheap
          path: dist-namecheap/lilycare-namecheap.zip
          retention-days: 30

      # Pubblicazione con lftp invece dell'azione FTP: quella caricava un file alla volta
      # (circa un secondo ciascuno) e con oltre 3000 file la sessione durava mezz'ora,
      # finché il server Namecheap la chiudeva. lftp trasferisce più file in parallelo
      # e si riconnette da solo se il server interrompe il collegamento.
      - name: Installa lftp
        if: env.DEPLOY == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Pubblica su Namecheap (FTP)
        if: env.DEPLOY == 'true'
        env:
          FTP_SERVER: ${{ github.ref_name == 'main' && secrets.FTP_SERVER || secrets.FTP_DEMO_SERVER }}
          FTP_USERNAME: ${{ github.ref_name == 'main' && secrets.FTP_USERNAME || secrets.FTP_DEMO_USERNAME }}
          # lftp legge la password da questa variabile: non compare mai nei comandi
          LFTP_PASSWORD: ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD || secrets.FTP_DEMO_PASSWORD }}
          REMOTE_DIR: ${{ github.ref_name == 'main' && (vars.FTP_SERVER_DIR || './') || (vars.FTP_DEMO_SERVER_DIR || './') }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 10
          set net:timeout 20
          set net:reconnect-interval-base 5
          mirror --reverse --parallel=5 --no-perms --ignore-time --verbose=1 dist-namecheap/lilycare-app/standalone/node_modules/ ${REMOTE_DIR}standalone/node_modules/
          mirror --reverse --parallel=5 --no-perms --verbose=1 --exclude ^standalone/node_modules/ --exclude ^tmp/ dist-namecheap/lilycare-app/ ${REMOTE_DIR}
          bye
          LFTP

      # Il file di riavvio si carica solo ora, a sito completo: Passenger ricarica
      # l'applicazione quando vede cambiare tmp/restart.txt.
      - name: Riavvia l'applicazione
        if: env.DEPLOY == 'true'
        env:
          FTP_SERVER: ${{ github.ref_name == 'main' && secrets.FTP_SERVER || secrets.FTP_DEMO_SERVER }}
          FTP_USERNAME: ${{ github.ref_name == 'main' && secrets.FTP_USERNAME || secrets.FTP_DEMO_USERNAME }}
          LFTP_PASSWORD: ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD || secrets.FTP_DEMO_PASSWORD }}
          REMOTE_DIR: ${{ github.ref_name == 'main' && (vars.FTP_SERVER_DIR || './') || (vars.FTP_DEMO_SERVER_DIR || './') }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 10
          set net:timeout 20
          mirror --reverse --no-perms --verbose=1 dist-namecheap/restart/ ${REMOTE_DIR}
          bye
          LFTP

      - name: Nessun FTP configurato
        if: env.DEPLOY != 'true'
        run: |
          echo "Pacchetto pronto ma non pubblicato: mancano i segreti FTP per il ramo '${{ github.ref_name }}'."
          echo "Scaricalo da questa pagina → Artifacts → lilycare-namecheap."
