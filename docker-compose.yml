# Avvio:  docker compose up -d --build
# Il sito sarà su http://localhost:3000 (dietro un reverse proxy HTTPS in produzione).
services:
  lilycare:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/lilycare.db
      MEDIA_DIR: /app/media
    volumes:
      - lilycare-data:/app/data # database (contenuti, richieste)
      - lilycare-media:/app/media # immagini caricate

volumes:
  lilycare-data:
  lilycare-media:
